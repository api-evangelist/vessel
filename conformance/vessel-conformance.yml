      x-vessel-webhook-signature is a SHA-256 hash of `${apiToken}:${timestamp}:${body}`, with the
      verification algorithm published in home/webhooks.mdx.
    caveat: >-
      A plain SHA-256 of a concatenation, not an HMAC; the shared secret is the caller's own API token
      rather than a separate signing secret.
