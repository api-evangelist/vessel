description: Vessel offers a unified API for SaaS integrations. The public pricing page lists three tiers
  - Start (free, 5 development connections), Launch (custom-priced, up to 20 connections), and Custom
  (custom-priced, unlimited connections, whitelabeling). All tiers advertise unlimited API calls; commercial
  pricing for Launch and Custom is negotiated directly.
