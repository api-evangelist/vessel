apis:
- aid: vessel:actions-api
  name: Vessel Actions API
  description: >-
    The Vessel Actions API provides pre-built, validated actions for common integration operations across
    CRM, sales engagement, marketing automation, chat, and dialer systems. Actions validate API responses
    and request inputs, standardize data types (ISO dates, string IDs), and abstract downstream provider
    quirks.
  humanURL: https://www.vessel.dev/
  tags:
  - Actions
  - Automation
  - Integrations
  - Validation
  properties:
  - type: Documentation
    url: https://www.vessel.dev/
  - type: GitHubRepository
    url: https://github.com/vesselapi/integrations
- aid: vessel:unified-api
  name: Vessel Unified API
  description: >-
    The Vessel Unified API provides a standardized interface across integrations, abstracting away the
    differences between third-party APIs to provide a consistent developer experience. Supports CRM, sales
    engagement, chat, marketing automation, and dialer categories.
  humanURL: https://www.vessel.dev/
  tags:
  - CRM
  - Chat
  - Dialers
  - Marketing Automation
  - Normalized
  - Sales Engagement
  - Unified API
  properties:
