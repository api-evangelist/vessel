aid: vessel
name: Vessel
description: 'Vessel (Kinit Inc.) is a developer-first embedded integrations platform for go-to-market software.
  It gives a product team one contract to read and write an end customer''s CRM, sales engagement, chat, dialer
  and marketing automation tools, plus a drop-in browser component — Vessel Link — that handles the end user''s
  authorization so the host application never touches downstream credentials. Three modules sit on an open-source
  integrations library: Unification (one normalized schema per vertical), Actions (typed, validated wrappers over
  a single provider''s native API), and Managed ETL. An /api/passthrough endpoint forwards arbitrary authenticated
  requests for anything the modules do not cover. Vessel publishes 20 OpenAPI 3.1.0 definitions covering 376 operations
  in its own documentation repository. As of 2026-08-13 those contracts are still public but the operational surface
  is not: api.vessel.dev does not answer, api.vessel.land has no DNS record, and both docs.vessel.dev and app.vessel.dev
  are unreachable.'
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
