apis:
- aid: vessel:platform-api
  name: Vessel Platform API
  description: The Vessel Platform API is the control plane of the Vessel embedded integrations platform. It covers
    the Link authentication handshake (session tokens and access tokens), the catalog of supported integrations,
    connection lifecycle (list, find, delete), customer-managed OAuth apps, the /api/passthrough escape hatch
    for calling a downstream provider's native API directly, and webhook subscription management. Every request
    is authenticated with an x-vessel-api-token header. Published by Vessel as OpenAPI 3.1.0 with 15 operations.
  humanURL: https://www.vessel.dev/
  baseURL: https://api.vessel.dev
  tags:
