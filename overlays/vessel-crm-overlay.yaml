info:
  title: Vessel CRM Unified API — API Evangelist Overlay
  version: 1.0.0
extends: openapi/vessel-crm-openapi.yml
x-provenance:
  generated: '2026-08-13'
  method: generated
  source: API Evangelist enrichment pipeline — enhancements over the verbatim spec harvested from https://github.com/vesselapi/all-api-docs
  note: The underlying OpenAPI is left byte-identical to what Vessel published. Every change below is
    an API Evangelist annotation, not a claim about Vessel's contract. The two substantive additions are
    tags (the published specs declare none, so no generator or catalog can group these operations) and
    the error responses that Vessel documents in prose but never declares in the contract.
actions:
- target: $.info
  update:
    contact:
      name: Vessel Support
      email: support@vessel.dev
      url: https://www.vessel.dev/
    description: 'Unified CRM API (v2). Normalizes contacts, deals, accounts, leads, notes, tasks, events,
      event attendees, emails, calls, lists and users across Salesforce, HubSpot, Zoho, Pipedrive, Close,
      Freshsales, Microsoft Dynamics, Affinity and monday.com. RPC over POST: reads are POSTs because
      filters, includes and synced-cache selectors travel in the body. Cursor pagination via cursor/nextPageCursor.
      Every object carries $native with the untranslated source record.'
