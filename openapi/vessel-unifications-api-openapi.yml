          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include:
                  $ref: '#/components/schemas/IncludeFields'
                cursor:
                  type: string
                synced:
                  $ref: '#/components/schemas/SyncedCache'
                filters:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/StringFilter'
                      description: Requires enabling Synced-cache
                    email:
                      type: object
                      properties:
                        equals:
                          type: string
                        in:
                          type: array
                          items:
                            type: string
                    firstName:
                      $ref: '#/components/schemas/StringFilter'
                      description: Requires enabling Synced-cache
                    lastName:
                      $ref: '#/components/schemas/StringFilter'
                      description: Requires enabling Synced-cache
                    jobTitle:
                      $ref: '#/components/schemas/StringFilter'
                      description: Requires enabling Synced-cache
                    phone:
                      $ref: '#/components/schemas/StringFilter'
                      description: Requires enabling Synced-cache
                    mobilePhone:
                      $ref: '#/components/schemas/StringFilter'
                      description: Requires enabling Synced-cache
                    createdTime:
                      $ref: '#/components/schemas/DateFilter'
                      description: Requires enabling Synced-cache
                    modifiedTime:
                      $ref: '#/components/schemas/DateFilter'
                      description: Requires enabling Synced-cache
                  description: If you are using filters for HubSpot, associations cannot be provided unless sync-cache is enabled.
                  required: email
                associations:
                  type: array
                  items:
                    type: string
                  description: 'Array of associations to include in the response.

                    Allowed values: accounts, deals, leads.

                    ownerUserId is always included in the response in the response.

                    '
            examples:
              example-1:
                value:
                  cursor: '123123'
                  filters:
                    email:
                      equals: michael@dunder.mifflin
                  include:
                    $native: false
                  associations:
                  - accounts
                  - deals
      description: Retrieve all Contacts
      tags:
      - Unifications
