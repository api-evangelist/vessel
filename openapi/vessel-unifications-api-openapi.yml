                type: object
                properties:
                  url:
                    type: string
                  orgId:
                    type: string
                  userId:
                    type: string
                  currency:
                    type: string
                    description: The default currency for the organization in ISO format
              examples:
                example-1:
                  value:
                    url: https://xyz.my.salesforce.com
                    orgId: org_1234
                    userId: user_1234
                    currency: USD
      parameters:
      - name: x-vessel-access-token
        in: header
        description: Access Token
        required: true
        schema:
          type: string
      operationId: get-info
