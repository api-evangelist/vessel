            examples:
              example-1:
                value:
                  include:
                    $native: false
                  ids:
                  - '123123'
                  - '456456'
                  - '567567'
      operationId: batch-read-users
      description: "Batch Read Users\n*CRM Caveats*:\n  Not supported for HubSpot."
      tags:
      - Unifications
    servers:
    - url: https://api.vessel.dev
