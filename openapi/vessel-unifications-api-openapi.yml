openapi: 3.2.0
info:
  title: Vessel Unifications API
  version: '1.0'
  description: 'Operations tagged Unifications across 5 of this provider''s published API definitions: vessel-chat-openapi.yml, vessel-crm-openapi.yml, vessel-dialer-openapi.yml, vessel-engagement-openapi.yml, vessel-marketing-automation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vessel.dev
security:
- VesselAPIToken: []
tags:
- name: Unifications
paths:
  /api/unifications/chat/users/list:
    parameters: []
    post:
      summary: List Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: responseBody
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextPageCursor:
                    type: string
              examples:
                example-1:
                  value:
                    users:
                    - id: e5f32d4fd2115220bd20a2ccf81210ec
                      name: Tom Haverford
                      isDeleted: false
                      createdTime: '2019-08-24T14:15:22Z'
                    nextPageCursor: '123123'
      parameters:
      - name: x-vessel-access-token
        in: header
        description: Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include:
                  $ref: '#/components/schemas/IncludeFields'
                cursor:
                  type: string
            examples:
              example-1:
                value:
                  cursor: '123123'
                  include:
                    $native: false
      operationId: get-all-users
      description: List Users
      tags:
      - Unifications
    servers:
    - url: https://api.vessel.dev
  /api/unifications/chat/channels/list:
    parameters: []
    post:
      summary: List Channels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: responseBody
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  nextPageCursor:
                    type: string
              examples:
                example-1:
                  value:
                    channels:
                    - id: e5f32d4fd2115220bd20a2ccf81210ec
                      name: Paper updates
                      createdTime: '2019-08-24T14:15:22Z'
                    nextPageCursor: '123123'
      parameters:
      - name: x-vessel-access-token
        in: header
        description: Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include:
                  $ref: '#/components/schemas/IncludeFields'
                cursor:
                  type: string
            examples:
              example-1:
                value:
                  cursor: '123123'
                  include:
                    $native: false
