      description: List Channel
      tags:
      - Unifications
    servers:
    - url: https://api.vessel.dev
  /api/unifications/chat/messages/create:
    parameters: []
    post:
      summary: Create Message
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: responseBody
                type: object
                properties:
                  id:
                    type: string
              examples:
                example-1:
                  value:
                    id: e5f32d4fd2115220bd20a2ccf81210ec
      parameters:
      - name: x-vessel-access-token
        in: header
        description: Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: object
                  properties:
                    text:
                      type: string
                    channelId:
                      type: string
                    $native:
                      ref: '#/components/schemas/NativeData'
            examples:
              example-1:
                value:
                  message:
                    text: New paper order
                    channelId: 34f5b4b0b6b650c981a174b02753c390
                    $native: {}
      operationId: post-message
      description: Create Message
      tags:
      - Unifications
    servers:
    - url: https://api.vessel.dev
  /api/unifications/chat/messages/update:
    parameters: []
    post:
      summary: Update Message
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: responseBody
                type: object
                properties:
                  id:
                    type: string
              examples:
                example-1:
                  value:
                    id: e5f32d4fd2115220bd20a2ccf81210ec
      parameters:
      - name: x-vessel-access-token
        in: header
        description: Access Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                message:
                  type: object
                  properties:
                    text:
                      type: string
                    channelId:
                      type: string
                    $native:
                      ref: '#/components/schemas/NativeData'
            examples:
              example-1:
                value:
                  id: e5f32d4fd2115220bd20a2ccf81210ec
                  message:
                    text: New paper order
                    channelId: 34f5b4b0b6b650c981a174b02753c390
                    $native: {}
      operationId: put-message
      description: Update Message
      tags:
      - Unifications
    servers:
    - url: https://api.vessel.dev
  /api/unifications/crm/info/find:
