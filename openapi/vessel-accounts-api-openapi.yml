openapi: 3.2.0
info:
  title: Vessel Accounts API
  version: '1.0'
  description: 'Operations tagged accounts across 3 of this provider''s published API definitions: vessel-crm-openapi.yml, vessel-crm-v1-openapi.yml, vessel-engagement-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vessel.dev
security:
- VesselAPIToken: []
tags:
- name: accounts
paths:
  /api/unifications/crm/accounts/update:
    post:
      summary: Update Account
      tags:
      - accounts
      operationId: update-account
      parameters:
      - name: x-vessel-access-token
        in: header
        description: Access Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: responseBody
                description: ''
                type: object
                x-examples:
                  example-1:
                    id: '0'
                properties:
                  id:
                    type: string
                required:
                - id
              examples:
                example-1:
                  value:
                    id: '0'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                synced:
                  $ref: '#/components/schemas/SyncedCache'
                account:
                  $ref: '#/components/schemas/AccountUpdate'
              required:
              - id
              - account
            examples:
              example-1:
                value:
                  id: string
                  account:
                    name: Blue Cross
                    description: Blue Cross of Pennsylvania is responsible for providing services to the good people of Scranton
                    industry: TV and Media
                    annualRevenue: 10000000
                    numberOfEmployees: 100
                    website: www.bluecross.penn
                    createdTime: '2019-08-24T14:15:22Z'
                    modifiedTime: '2019-08-24T14:15:22Z'
                    phone: '8192223333'
                    address:
                      street: 100 Blue Dr
                      city: Scranton
                      state: Pennsylvania
                      postalCode: '281332'
                      country: USA
                    $native: {}
      description: Update an existing Account
    servers:
    - url: https://api.vessel.dev
  /crm/accounts:
    parameters: []
    get:
      summary: Get All Accounts
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: responseBody
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  nextPageCursor:
                    type: string
              examples:
                example-1:
                  value:
                    accounts:
                    - id: v.account.0dcb45e051315a6ea63b0f16e73689d9
                      nativeId: '344'
                      name: Blue Cross
                      description: Blue Cross of Pennsylvania is responsible for providing services to the good people of Scranton
                      industry: TV and Media
                      annualRevenue: 10000000
                      numberOfEmployees: 100
                      website: www.bluecross.penn
                      createdTime: '2019-08-24T14:15:22Z'
                      modifiedTime: '2019-08-24T14:15:22Z'
                      phone: '8192223333'
                      address:
                        street: 100 Blue Dr
                        city: Scranton
                        state: Pennsylvania
                        postalCode: '281332'
                        country: USA
                      associations:
                        dealIds:
                        - v.deal.497fb529e6805351b5dc8057c74a4a52
                        contactIds:
                        - v.contact.e5f32d4fd2115220bd20a2ccf81210ec
                        noteIds:
                        - v.note.006b4db16b6b50c981a174b02753c390
                        taskIds:
                        - v.task.2322707bbc41577d9806400e2daa25de
                        leadIds:
                        - v.lead.d08f345ace24509e911a0ea8e3d2203c
                        eventIds:
                        - v.event.0000d2e83d6c5d52a61f2fb860666477
                        emailIds:
                        - v.email.3ab3a9562af957228c1019127e3c81e1
                        callIds:
                        - v.call.1222707bbc415ee4806400e2daa25ffa
                        ownerUserId: v.user.56f653659ea9524b9e0fb0ba67e6f8a0
                      additional: {}
                    nextPageCursor: string
      operationId: get-all-crm-accounts
      parameters:
      - schema:
          type: string
        in: query
        name: accessToken
        description: The token for the customer's CRM account. This was generated when they connected their account.
        required: true
      - schema:
          type: string
        in: query
        name: cursor
      - schema:
          type: number
        in: query
        name: limit
        description: The number of records to return per page.
      - schema:
          type: boolean
        in: query
        name: allFields
        description: Returns all fields including non-unifiable and custom fields under the "additional" property in the response
      description: Retrieve all Accounts
    servers:
    - url: https://api.vessel.dev
  /crm/accounts/search:
    post:
      summary: Search Accounts
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/StringFilter'
                    nativeId:
                      $ref: '#/components/schemas/StringFilter'
                    name:
                      $ref: '#/components/schemas/StringFilter'
                    description:
                      $ref: '#/components/schemas/StringFilter'
                    industry:
                      $ref: '#/components/schemas/StringFilter'
                    website:
                      $ref: '#/components/schemas/StringFilter'
                    street:
                      $ref: '#/components/schemas/StringFilter'
                    city:
                      $ref: '#/components/schemas/StringFilter'
                    state:
                      $ref: '#/components/schemas/StringFilter'
                    postalCode:
                      $ref: '#/components/schemas/StringFilter'
                    country:
                      $ref: '#/components/schemas/StringFilter'
                    phone:
                      $ref: '#/components/schemas/StringFilter'
                    annualRevenue:
                      $ref: '#/components/schemas/NumberFilter'
                    numberOfEmployees:
                      $ref: '#/components/schemas/NumberFilter'
                    createdTime:
                      $ref: '#/components/schemas/DateFilter'
                    modifiedTime:
                      $ref: '#/components/schemas/DateFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  nextPageCursor:
                    type: string
                title: responseBody
              examples:
                example-1:
                  value:
                    accounts:
                    - id: v.account.0dcb45e051315a6ea63b0f16e73689d9
                      nativeId: '344'
                      name: Blue Cross
                      description: Blue Cross of Pennsylvania is responsible for providing services to the good people of Scranton
                      industry: TV and Media
                      annualRevenue: 10000000
                      numberOfEmployees: 100
                      website: www.bluecross.penn
                      createdTime: '2019-08-24T14:15:22Z'
                      modifiedTime: '2019-08-24T14:15:22Z'
                      phone: '8192223333'
                      address:
                        street: 100 Blue Dr
                        city: Scranton
                        state: Pennsylvania
                        postalCode: '281332'
                        country: USA
                      associations:
                        dealIds:
                        - v.deal.497fb529e6805351b5dc8057c74a4a52
                        contactIds:
                        - v.contact.e5f32d4fd2115220bd20a2ccf81210ec
                        noteIds:
                        - v.note.006b4db16b6b50c981a174b02753c390
                        taskIds:
                        - v.task.2322707bbc41577d9806400e2daa25de
                        leadIds:
                        - v.lead.d08f345ace24509e911a0ea8e3d2203c
                        eventIds:
                        - v.event.0000d2e83d6c5d52a61f2fb860666477
                        emailIds:
                        - v.email.3ab3a9562af957228c1019127e3c81e1
                        callIds:
                        - v.call.1222707bbc415ee4806400e2daa25ffa
                        ownerUserId: v.user.56f653659ea9524b9e0fb0ba67e6f8a0
                      additional: {}
                    nextPageCursor: string
      operationId: search-crm-accounts
      description: Search all Accounts using filters
      parameters:
      - $ref: '#/components/parameters/accessToken'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/allFields'
    servers:
    - url: https://api.vessel.dev
  /crm/account:
    parameters: []
    get:
