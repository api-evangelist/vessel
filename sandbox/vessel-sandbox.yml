summary:
  hosted_sandbox: false
  key_modes: 2
  test_data_published: false
  note: >-
    Vessel has no separate sandbox host and publishes no test fixtures, magic identifiers or seeded
    accounts. Its test story is a second API key with a lower connection ceiling, pointed at a real
    downstream account you supply yourself.
modes:
  - name: development
    key: development API key
    endpoint: same as production (api.vessel.dev / api.vessel.land)
    limits:
      connections: 5
    error_on_exhaustion: Maximum number of connections reached for development account
    remediation: >-
      List connections for the development key and delete unused ones, or move to the production key.
    source: home/hidden/error-faq.mdx
  - name: production
    key: production API key
    endpoint: same as development
    limits:
      connections: 'per plan — 20 on Launch, unlimited on Custom'
    source: https://www.vessel.dev/pricing
modes_note: >-
  "Every Vessel customer is issued two API keys: A development API Key and a production API Key."
  Both keys address the same hosts and the same paths; the mode is a property of the credential, not
  of the endpoint, so there is no URL-level guardrail preventing a development integration from
  touching production data.
test_accounts:
  provided_by_vessel: false
  guidance: >-
